<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%93%88</text></svg>">
<title>__CLIENT_NAME__ SEO Portal</title>
<style>
  html { color-scheme: light dark; }
  body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; background: #f9f9f7; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<style>
  .pt {
    color-scheme: dark;
    --bg: #000000;
    --panel: #101113;
    --panel-2: #16171a;
    --line: rgba(255,255,255,0.09);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #ffffff;
    --ink-2: #b9b8b3;
    --ink-3: #85847f;
    --gold: #e6b84d;
    --gold-dim: rgba(230,184,77,0.14);
    --s1: #c98500;
    --s2: #3987e5;
    --s3: #199e70;
    --s4: #d95926;
    --good: #0ca30c;
    --bad: #e66767;
    --live: #2ee06a;
  }
  * { box-sizing: border-box; }
  .pt {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: grid; grid-template-columns: 264px 1fr;
  }

  /* ---------- sidebar ---------- */
  .side {
    background: #060607; border-right: 1px solid var(--line);
    padding: 20px 16px; display: flex; flex-direction: column; gap: 18px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .side .logo { padding: 4px 6px 2px; }
  .side .logo img { width: 172px; height: auto; display: block; }
  .side .tagline { font-size: 9.5px; letter-spacing: .18em; color: var(--ink-3); text-transform: uppercase; margin-top: 4px; padding-left: 6px; }

  .acct { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); }
  .acct .cap { font-size: 10px; letter-spacing: .13em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 8px; }
  .acct select {
    width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-strong);
    border-radius: 9px; padding: 9px 10px; font-size: 13.5px; font-weight: 600; font-family: inherit;
  }
  .acct .verified { font-size: 11.5px; color: var(--s3); margin-top: 7px; display: flex; align-items: center; gap: 6px; }

  nav.navlist { display: flex; flex-direction: column; gap: 2px; }
  nav.navlist button {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: none; border: 0; color: var(--ink-2); font: inherit; font-size: 13.5px;
    padding: 9px 11px; border-radius: 9px; cursor: pointer;
  }
  nav.navlist button:hover { background: rgba(255,255,255,0.05); color: var(--ink); }
  nav.navlist button[aria-current="true"] { background: var(--gold-dim); color: var(--ink); font-weight: 600; }
  nav.navlist button[aria-current="true"] svg { stroke: var(--gold); }
  nav.navlist svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; flex-shrink: 0; }
  nav.navlist .off { margin-left: auto; font-size: 9.5px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

  .side .role { margin-top: auto; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); }
  .side .role .rt { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .side .role .rd { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.45; }

  /* ---------- main ---------- */
  .main { min-width: 0; }
  .livebar {
    position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,0.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 14px 26px; display: flex; align-items: center; gap: 26px; flex-wrap: wrap;
  }
  .live-now { display: flex; align-items: center; gap: 12px; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(46,224,106,.6); animation: pl 2s infinite; }
  @keyframes pl { 0%{box-shadow:0 0 0 0 rgba(46,224,106,.55)} 70%{box-shadow:0 0 0 9px rgba(46,224,106,0)} 100%{box-shadow:0 0 0 0 rgba(46,224,106,0)} }
  .live-num { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .live-cap { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .live-sub { font-size: 11.5px; color: var(--ink-2); }
  .live-pages { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
  .live-pages b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .live-stale { font-size: 11px; color: var(--ink-3); margin-left: auto; }

  .view { padding: 24px 26px 70px; max-width: 1500px; }
  .view h2 { font-size: 19px; margin: 0 0 3px; font-weight: 700; }
  .view .lede { font-size: 12.5px; color: var(--ink-3); margin-bottom: 20px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 17px 19px; min-width: 0; }

/* ---- dashboard chrome (redesign, 2026-09-06) ----
   Accent is --s4 from the validated series palette rather than brand gold:
   gold is chrome-only here because it fails the dark-surface lightness band
   when used as a data colour, and the accent doubles as a chart mark. */
.pt { --accent: #e2542c; --accent-dim: rgba(226,84,44,0.13); }
.display { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  font-size: 30px; letter-spacing: -.01em; margin: 0 0 4px; font-weight: 600; }
.dhead { display: flex; align-items: flex-start; justify-content: space-between;
  gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
.dtools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ranges { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.ranges button { background: transparent; color: var(--ink-3); border: 0; cursor: pointer;
  font: 600 11px/1 system-ui, sans-serif; letter-spacing: .04em; padding: 9px 13px; }
.ranges button:hover { color: var(--ink); }
.ranges button.on { background: var(--accent); color: #fff; }
.tbtn { background: var(--panel); color: var(--ink-2); border: 1px solid var(--line);
  border-radius: 9px; cursor: pointer; font: 600 11px/1 system-ui, sans-serif;
  padding: 9px 14px; letter-spacing: .04em; }
.tbtn:hover { color: var(--ink); border-color: var(--line-strong); }
.tbtn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn.accent:hover { filter: brightness(1.08); }
.tbtn[disabled] { opacity: .55; cursor: default; }

.g-live { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; margin-bottom: 14px; }
.livebig { background: linear-gradient(135deg, #0b1a12 0%, var(--panel) 62%); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px;
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; }
.pill.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
.lrow { display: flex; align-items: center; gap: 16px; margin: 20px 0 10px; }
.lnum { font-family: Georgia, serif; font-size: 58px; line-height: .9; }
.lcap { font-size: 16px; font-weight: 600; }
.lnote { color: var(--ink-2); font-size: 12.5px; line-height: 1.55; margin: 8px 0 0; max-width: 62ch; }
.snap { display: flex; flex-direction: column; gap: 10px; }
.snapbox { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; background: var(--panel-2); }
.snapval { font-size: 14px; font-weight: 600; margin-top: 3px; word-break: break-word; }
.bigbtn { display: block; text-align: center; background: var(--accent); color: #fff;
  text-decoration: none; border-radius: 9px; padding: 11px; font-size: 12.5px;
  font-weight: 600; margin-top: auto; }
.bigbtn:hover { filter: brightness(1.08); }
.bigbtn.ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent);
  display: inline-block; margin-top: 12px; padding: 9px 16px; }
.bigbtn.ghost:hover { background: var(--accent-dim); filter: none; }

.signal { background: linear-gradient(135deg, #1a0d08 0%, var(--panel) 58%); margin-bottom: 18px; }
.klabel.accent { color: var(--accent); }
.signalh { font-size: 17px; margin: 6px 0 6px; font-weight: 600; }
.signalp { color: var(--ink-2); font-size: 13px; line-height: 1.6; margin: 0; max-width: 88ch; }

.groups { align-items: start; }
.gsrc { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--gold); font-weight: 700; margin-bottom: 4px; }
.ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  font-size: 19px; font-weight: 600; margin-bottom: 10px; }
.gchange { font-size: 11px; font-weight: 400; color: var(--ink-3); }
.kpis.two { grid-template-columns: 1fr 1fr; }
.kcap { color: var(--ink-3); font-size: 11px; margin-top: 7px; }
.nodata { color: var(--ink-3); font-size: 12.5px; padding: 6px 0; }
.caveat { background: linear-gradient(135deg, #1a0d08 0%, var(--panel) 58%); margin-top: 16px; }
.caveat .signalp { margin-top: 5px; }

@media (max-width: 980px) {
  .g-live { grid-template-columns: 1fr; }
  .display { font-size: 24px; }
  .lnum { font-size: 46px; }
}

/* ---- click-through affordances ---- */
/* A linked KPI is still a card: reset the anchor, then signal affordance with
   border + lift only. Colour alone would not read for a colour-blind viewer. */
a.card.linked {
  display: block; text-decoration: none; color: inherit; position: relative;
  transition: border-color .13s ease, transform .13s ease, background .13s ease;
}
a.card.linked:hover, a.card.linked:focus-visible {
  border-color: var(--gold); transform: translateY(-2px); background: var(--panel-2);
}
a.card.linked:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.kgo {
  position: absolute; top: 12px; right: 13px; font-size: 12px; line-height: 1;
  color: var(--ink-3); opacity: 0; transition: opacity .13s ease;
}
a.card.linked:hover .kgo, a.card.linked:focus-visible .kgo { opacity: 1; color: var(--gold); }

.card h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.popen {
  font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
  color: var(--ink-3); text-decoration: none; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px;
  transition: color .13s ease, border-color .13s ease;
}
.popen:hover, .popen:focus-visible { color: var(--gold); border-color: var(--gold); }
.popen:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  a.card.linked, a.card.linked:hover { transition: none; transform: none; }
}
  .card h3 { font-size: 12.5px; margin: 0 0 2px; font-weight: 600; }
  .card .csub { font-size: 11px; color: var(--ink-3); margin-bottom: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 11px; margin-bottom: 18px; }
  .kpi .klabel { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
  .kpi .kval { font-size: 25px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi .kdelta { font-size: 11.5px; margin-top: 7px; display: flex; align-items: center; gap: 4px; }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--ink-3); }

  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .mt { margin-top: 14px; }

  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .gridline { stroke: rgba(255,255,255,0.07); }
  .axlab { fill: var(--ink-3); font-size: 10px; }
  .lp { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  table.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.dt th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; padding: 7px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  table.dt td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--ink-2); }
  table.dt td:first-child { color: var(--ink); }
  table.dt tr:last-child td { border-bottom: none; }
  table.dt td.num, table.dt th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll-y { max-height: 460px; overflow-y: auto; }
  .tw { overflow-x: auto; }
  .trunc { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }

  .brow { display: flex; align-items: center; gap: 11px; margin: 9px 0; }
  .blabel { width: 132px; font-size: 12px; color: var(--ink-2); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btrack { flex: 1; background: rgba(255,255,255,0.07); border-radius: 4px; height: 9px; min-width: 40px; }
  .bfill { height: 100%; border-radius: 4px; }
  .bval { width: 66px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .pill { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-2); }
  .pill.ok { color: var(--good); border-color: rgba(12,163,12,.45); }
  .pill.warn { color: var(--gold); border-color: rgba(230,184,77,.4); }
  .pill.no { color: var(--bad); border-color: rgba(230,103,103,.4); }

  .empty { border: 1px dashed var(--line-strong); border-radius: 13px; padding: 30px 26px; text-align: center; }
  .empty h4 { margin: 0 0 8px; font-size: 14px; }
  .empty p { margin: 0 auto; max-width: 520px; font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }

  .tip { position: absolute; pointer-events: none; opacity: 0; background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; font-size: 11.5px; white-space: nowrap; z-index: 9; }
  .tip .td { color: var(--ink-3); font-size: 10.5px; }
  .cwrap { position: relative; }

  .hamb { display: none; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } .g3 { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    .pt { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 60; width: 286px; left: 0; top: 0; transform: translateX(-100%); transition: transform .22s; }
    .pt.open .side { transform: none; }
    .hamb { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); cursor: pointer; }
    .g2 { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .view { padding: 18px 15px 60px; }
    .livebar { padding: 12px 15px; gap: 16px; }
  }

  /* ---------- insight ticker ----------
     A marquee only earns its place if it carries something the client would
     act on, so every item is a measured finding from build_insights(). */
  .ticker {
    position: relative; overflow: hidden; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0a0b0d, #050506);
    height: 40px; display: flex; align-items: center;
  }
  .ticker-track {
    display: flex; align-items: center; gap: 46px; white-space: nowrap;
    will-change: transform; padding-left: 100%;
    animation: ticker-scroll var(--ticker-dur, 90s) linear infinite;
  }
  /* Pausing on hover is the difference between a banner you can read and one
     that taunts you. */
  .ticker:hover .ticker-track { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) {
    .ticker { height: auto; }
    .ticker-track { animation: none; padding-left: 0; white-space: normal;
                    flex-wrap: wrap; gap: 8px 26px; padding: 9px 22px; }
  }
  @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tick { display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; }
  .tick i { width: 6px; height: 6px; border-radius: 50%; flex: none; font-style: normal; }
  .tick.good i { background: var(--s3); box-shadow: 0 0 8px rgba(25,158,112,.7); }
  .tick.bad  i { background: var(--bad); box-shadow: 0 0 8px rgba(230,103,103,.6); }
  .tick.warn i { background: var(--gold); box-shadow: 0 0 8px rgba(230,184,77,.6); }
  .tick.flat i { background: var(--ink-3); }
  .tick b { color: var(--ink); font-weight: 650; letter-spacing: .05em;
            text-transform: uppercase; font-size: 10.5px; }
  .tick span { color: var(--ink-2); }
  .ticker-empty { padding: 0 22px; font-size: 12.5px; color: var(--ink-3); }

  /* ---------- live command centre ---------- */
  .cmd { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.25fr); gap: 16px; }
  .globe-card {
    position: relative; overflow: hidden; min-height: 430px;
    border: 1px solid var(--line); border-radius: 14px;
    background: radial-gradient(120% 90% at 50% 6%, #0d1420 0%, #08090b 62%);
  }
  .globe-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Markers ride in their own layer so they can carry text and tooltips that a
     shader cannot. */
  .globe-pins { position: absolute; inset: 0; pointer-events: none; }
  .pin { position: absolute; transform: translate(-50%, -50%); }
  .pin b {
    display: block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--live); box-shadow: 0 0 0 2px rgba(46,224,106,.28), 0 0 12px rgba(46,224,106,.9);
  }
  .pin::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px;
    margin: -4.5px 0 0 -4.5px; border-radius: 50%; border: 1px solid rgba(46,224,106,.75);
    animation: pin-ping 2.4s ease-out infinite;
  }
  @keyframes pin-ping { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(4.6); opacity: 0; } }
  .pin em {
    position: absolute; left: 14px; top: -6px; font-style: normal; font-size: 11px;
    color: var(--ink); background: rgba(6,8,10,.74); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 2px 7px; white-space: nowrap; backdrop-filter: blur(4px);
  }
  .globe-badge {
    position: absolute; left: 18px; bottom: 16px; z-index: 2;
    background: rgba(6,8,10,.62); border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 11px 15px; backdrop-filter: blur(7px);
  }
  .globe-badge .n { font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .globe-badge .c { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .globe-note { position: absolute; right: 16px; bottom: 16px; z-index: 2; font-size: 11px; color: var(--ink-3); }
  .globe-fallback {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 26px; font-size: 12.5px; color: var(--ink-3);
  }
  @media (max-width: 1080px) { .cmd { grid-template-columns: 1fr; } }
</style>

<div class="pt" id="root">
  <aside class="side" id="side">
    <div>
      <div class="logo"><img id="logo-img" alt="AZ Web Corp"></div>
      <div class="tagline">Arizona Digital Agency</div>
    </div>

    <div class="acct">
      <div class="cap">Client account</div>
      <select id="client-select"></select>
      <div class="verified" id="client-verified"></div>
    </div>

    <nav class="navlist" id="nav"></nav>

    <div class="role">
      <div class="rt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0ca30c" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Agency administrator</div>
      <div class="rd">Reporting is view-only. Client logins are not enabled on this build yet.</div>
    </div>
  </aside>

  <div class="main">
    <div class="livebar">
      <button class="hamb" id="hamb" aria-label="Menu">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="live-now">
        <span class="pulse"></span>
        <div>
          <div class="live-cap">Live audience</div>
          <div class="live-num" id="live-count">–</div>
        </div>
        <div class="live-sub" id="live-label">active in the last 30 min</div>
      </div>
      <div class="live-pages" id="live-pages"></div>
      <div class="live-stale" id="live-stale"></div>
    </div>
    <div class="ticker" id="ticker" aria-label="Performance headlines"></div>
    <div id="views"></div>
  </div>
</div>

<script>
const DATA = __PORTAL_DATA__;

/* Headline findings for the ticker, computed at build time by
   build_portal.build_insights() so the browser never has to re-derive them. */
const INSIGHTS = __PORTAL_INSIGHTS__;

/* NASA Blue Marble day + city-lights night maps for the globe, injected from
   assets/*.b64. Data URIs rather than sibling files because WebGL treats a
   sibling image as cross-origin when the page is opened from disk. */

function delta(cur, prev, opts = {}) {
  const invert = !!opts.invert;
  if (prev === 0 && cur === 0) return '<div class="kdelta flat">no change</div>';
  const diff = cur - prev;
  const pctChange = prev ? (diff / prev) * 100 : null;
  const better = invert ? diff < 0 : diff > 0;
  const cls = diff === 0 ? 'flat' : (better ? 'up' : 'down');
  const arrow = diff === 0 ? '' : (diff > 0 ? '▲' : '▼');
  const shown = opts.fixed ? Math.abs(diff).toFixed(1) : fmt(Math.abs(diff));
  const tail = pctChange === null ? '' : ` (${Math.abs(pctChange).toFixed(0)}%)`;
  // Label follows the selected range. Hardcoding "28d" while the user has 90D
  // selected states a comparison that was never made.
  const period = opts.period || `prev ${RANGE}d`;
  return `<div class="kdelta ${cls}">${arrow} ${shown}${tail} <span style="color:var(--ink-3)">vs ${period}</span></div>`;
}

function kpiCard(label, value, deltaHtml, linkTo, caption) {
  const inner = `<div class="klabel">${label}</div><div class="kval">${value}</div>${deltaHtml || ''}`
    + (caption ? `<div class="kcap">${caption}</div>` : '');
  if (!linkTo) return `<div class="card kpi">${inner}</div>`;
  // Real anchors, not click handlers: middle-click, ctrl-click and "open in new
  // tab" all have to work, and a div with onclick breaks every one of them.
  return `<a class="card kpi linked" href="?view=${linkTo}" target="_blank" rel="noopener"
    title="Open ${label} detail in a new tab">${inner}<span class="kgo" aria-hidden="true">&#8599;</span></a>`;
}

/* ---------------- selectable range ----------------
   The pills are real, not decorative: GSC gives us 90 days of daily rows, so
   any window up to 90 days is recomputed from measured data. Position is
   impression-weighted, matching how Search Console itself averages it - a
   plain mean would quietly disagree with the GSC UI. */
let RANGE = 30;

// Declared up here, not with the polling code at the bottom: the dashboard's
// after() paints the live card on first render, which is before that section runs.
let liveData = null;
let globeState = null;   // active globe render loop, torn down on view change

function windowTotals(days, offset) {
  const d = G.daily || [];
  const end = d.length - (offset || 0);
  const rows = d.slice(Math.max(0, end - days), Math.max(0, end));
  const clicks = rows.reduce((a, r) => a + r.clicks, 0);
  const impressions = rows.reduce((a, r) => a + r.impressions, 0);
  const position = impressions
    ? rows.reduce((a, r) => a + r.position * r.impressions, 0) / impressions : 0;
  return { clicks, impressions, ctr: impressions ? clicks / impressions : 0, position, days: rows.length };
}

// Computed lazily in the dashboard render: G is declared further down, so
// evaluating this at declaration time hits the temporal dead zone.
let W;
function recalcWindow() { W = { cur: windowTotals(RANGE, 0), prev: windowTotals(RANGE, RANGE) }; }

/* The signal is DERIVED, never written once and reused. It states only what was
   measured - no modelled "clicks you could win" figure, because a client cannot
   tell a projection from a measurement once it is on the page. */
function execSignal() {
  const c = W.cur, p = W.prev;
  const dir = (a, b) => (b === 0 ? (a > 0 ? 'rose' : 'held flat')
    : a > b ? 'rose' : a < b ? 'fell' : 'held flat');
  const pct = (a, b) => (b ? Math.abs((a - b) / b * 100).toFixed(1) + '%' : 'n/a');

  // Biggest visible gap: most impressions among keywords on page 1-2 that are
  // not converting. Pure measurement.
  const gap = (G.topQueries || [])
    .filter(q => q.position >= 4 && q.position <= 20)
    .sort((a, b) => b.impressions - a.impressions)[0];

  const head = c.clicks >= p.clicks
    ? 'Search visibility is holding or improving.'
    : 'The next gains will come from focused optimization.';

  let body = `Search clicks ${dir(c.clicks, p.clicks)} ${pct(c.clicks, p.clicks)} and impressions `
    + `${dir(c.impressions, p.impressions)} ${pct(c.impressions, p.impressions)} versus the previous ${RANGE} days.`;
  if (gap) {
    body += ` The largest visible gap is “${esc(gap.query)}” — ${fmt(gap.impressions)} impressions `
      + `at position ${fmt1(gap.position)}, converting at ${pctf(gap.ctr)}.`;
  } else {
    body += ' No keyword is currently ranking between positions 4 and 20 with meaningful impressions.';
  }
  return { head, body };
}

/* ---------------- charts ---------------- */
function lineChart(el, rows, key, color, valFmt) {
  const W = 620, H = 190, padL = 34, padR = 14, padT = 12, padB = 20;
  const pw = W - padL - padR, ph = H - padT - padB;
  const maxV = Math.max(1, ...rows.map(r => r[key]));
  const n = rows.length;
  const X = i => padL + (n === 1 ? pw / 2 : (i / (n - 1)) * pw);
  const Y = v => padT + ph - (v / maxV) * ph;

  let grid = '';
  for (let g = 0; g <= 3; g++) {
    const gy = padT + (g / 3) * ph;
    grid += `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${gy}" y2="${gy}"/>`;
    grid += `<text class="axlab" x="0" y="${gy + 3}">${valFmt(maxV * (1 - g / 3))}</text>`;
  }
  let d = '', area = '';
  rows.forEach((r, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(r[key]).toFixed(1) + ' '; });
  area = d + `L${X(n - 1).toFixed(1)},${padT + ph} L${X(0).toFixed(1)},${padT + ph} Z`;

  const first = rows[0], last = rows[n - 1];
  el.innerHTML = `<div class="cwrap">
    <svg class="chart" viewBox="0 0 ${W} ${H}">
      ${grid}
      <path d="${area}" fill="${color}" opacity=".13"/>
      <path class="lp" d="${d}" stroke="${color}"/>
      <circle cx="${X(n - 1).toFixed(1)}" cy="${Y(last[key]).toFixed(1)}" r="3.6" fill="${color}"/>
      <line class="hl" x1="0" x2="0" y1="${padT}" y2="${padT + ph}" stroke="rgba(255,255,255,.25)" opacity="0"/>
      <circle class="hd" r="4.5" fill="${color}" opacity="0"/>
      <text class="axlab" x="${padL}" y="${H - 4}">${shortDate(first.date)}</text>
      <text class="axlab" x="${W - padR}" y="${H - 4}" text-anchor="end">${shortDate(last.date)}</text>
      <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="cap"/>
    </svg><div class="tip"></div></div>`;

  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const hl = el.querySelector('.hl'), hd = el.querySelector('.hd');
  svg.querySelector('.cap').addEventListener('mousemove', e => {
    const rect = svg.getBoundingClientRect();
    const rx = (e.clientX - rect.left) / rect.width * W;
    let i = Math.round(((rx - padL) / pw) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const px = X(i), py = Y(rows[i][key]);
    hl.setAttribute('x1', px); hl.setAttribute('x2', px); hl.style.opacity = 1;
    hd.setAttribute('cx', px); hd.setAttribute('cy', py); hd.style.opacity = 1;
    tip.style.opacity = 1;
    tip.style.left = Math.min(px / W * rect.width + 12, rect.width - 110) + 'px';
    tip.style.top = (py / H * rect.height - 34) + 'px';
    tip.innerHTML = `<div class="td">${shortDate(rows[i].date)}</div><b>${valFmt(rows[i][key])}</b>`;
  });
  svg.querySelector('.cap').addEventListener('mouseleave', () => {
    hl.style.opacity = 0; hd.style.opacity = 0; tip.style.opacity = 0;
  });
}

function bars(el, rows, key, labelKey, color, valFmt) {
  const max = Math.max(1, ...rows.map(r => +r[key] || 0));
  el.innerHTML = rows.length ? rows.map(r => `
    <div class="brow">
      <div class="blabel" title="${esc(r[labelKey])}">${esc(r[labelKey])}</div>
      <div class="btrack"><div class="bfill" style="width:${((+r[key] || 0) / max * 100).toFixed(1)}%;background:${color}"></div></div>
      <div class="bval">${valFmt(r[key])}</div>
    </div>`).join('') : '<div style="color:var(--ink-3);font-size:12.5px">No data in this period.</div>';
}

function table(rows, cols, opts = {}) {
  if (!rows.length) return '<div style="color:var(--ink-3);font-size:12.5px;padding:6px 2px">No data in this period.</div>';
  const body = rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  return `<div class="tw ${opts.scroll ? 'scroll-y' : ''}"><table class="dt">
    <thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}">${c.label}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

/* ---------------- shell ---------------- */
const order = ['dashboard', 'live', 'search', 'keywords', 'analytics', 'landing', 'opportunities', 'technical', 'gbp', 'ai', 'competitors', 'reports', 'connections'];
let active = 'dashboard';

function buildNav() {
  document.getElementById('nav').innerHTML = order.map(k => {
    const v = VIEWS[k];
    return `<button data-k="${k}" aria-current="${k === active}">
      <svg viewBox="0 0 24 24">${ICONS[v.icon] || ''}</svg>${v.label}
      ${v.off ? '<span class="off">off</span>' : ''}</button>`;
  }).join('');
  document.querySelectorAll('#nav button').forEach(b => {
    b.addEventListener('click', () => { show(b.dataset.k); document.getElementById('root').classList.remove('open'); });
  });
}

function show(k) {
  active = k;
  const v = VIEWS[k];
  const host = document.getElementById('views');
  host.innerHTML = '<div class="view">' + v.render() + '</div>';
  if (v.after) v.after();
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.k === k)));
  window.scrollTo({ top: 0 });
}

/* Account switcher.

   On a client build the roster holds exactly one entry - this client - so the
   control is inert and the page carries no evidence that other properties
   exist. On the agency build it lists every property and navigates between
   them. The roster is decided at build time, never at runtime, so a client
   page cannot be coaxed into revealing the rest. */
const ROSTER = __CLIENT_ROSTER__;
const PORTAL_ROLE = '__PORTAL_ROLE__';

const sel = document.getElementById('client-select');
sel.innerHTML = ROSTER.map(c =>
  `<option value="${esc(c.slug)}"${c.name === '__CLIENT_NAME__' ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
sel.disabled = ROSTER.length < 2;
if (ROSTER.length > 1) {
  // The agency copies are served by a PHP gate from outside the webroot, so
  // switching is a query parameter on that gate, not a sibling directory.
  sel.addEventListener('change', () => {
    // Keep whichever view is open when switching property, so comparing the
    // same screen across clients does not mean re-navigating each time.
    const u = new URL(location.href);
    u.searchParams.set('c', sel.value);
    location.href = u.toString();
  });
}
if (PORTAL_ROLE === 'owner') {
  document.querySelector('.acct .cap').textContent = 'Agency view · all properties';
}
document.getElementById('client-verified').innerHTML =
  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#199e70" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg> __CLIENT_DOMAIN__';
document.getElementById('hamb').addEventListener('click', () => document.getElementById('root').classList.toggle('open'));

buildNav();
renderTicker();

/* Deep link: ?view=<key> lets every dashboard card open its detail in a new tab.
   Unknown or absent key falls back to the dashboard rather than erroring. */
const wantedView = new URLSearchParams(location.search).get('view');
show(VIEWS[wantedView] ? wantedView : 'dashboard');

/* Keep the URL honest when navigating in-tab, so a copied link reopens the
   same view and Back works. */
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const u = new URL(location.href);
  u.searchParams.set('view', b.dataset.k);
  history.replaceState({}, '', u);
});

/* ---------------- live polling ---------------- */
function paintLive() {
  const c = document.getElementById('live-count');
  const pagesEl = document.getElementById('live-pages');
  const stale = document.getElementById('live-stale');
  if (!liveData) {
    c.textContent = '–';
    stale.textContent = 'live feed unavailable here';
    pagesEl.innerHTML = '';
  } else if (liveData.error) {
    c.textContent = '–';
    stale.textContent = liveData.error;
    pagesEl.innerHTML = '';
  } else {
    c.textContent = fmt(liveData.activeUsers);
    stale.textContent = 'updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    pagesEl.innerHTML = (liveData.pages || []).slice(0, 4)
      .map(p => `<span>${esc(p.page)} <b>${fmt(p.users)}</b></span>`).join('');
  }
  renderLiveDetail();
  paintLiveCard();
}

function renderLiveDetail() {
  const big = document.getElementById('live-big');
  if (!big) return;
  const status = document.getElementById('live-status');
  const barsEl = document.getElementById('live-page-bars');
  const placesEl = document.getElementById('live-places');
  const noteEl = document.getElementById('globe-note');
  const capEl = document.getElementById('live-big-cap');

  if (!liveData || liveData.error) {
    big.textContent = '–';
    status.textContent = liveData && liveData.error ? liveData.error
      : 'The live endpoint is only reachable on the hosted copy at azwebcorp.com/reports/.';
    barsEl.innerHTML = '<div style="color:var(--ink-3);font-size:12.5px">No live feed available here.</div>';
    if (placesEl) placesEl.innerHTML = '<div class="nodata">No live feed available here.</div>';
    if (noteEl) noteEl.textContent = 'Globe idling — no live feed';
    return;
  }

  const n = liveData.activeUsers || 0;
  big.textContent = fmt(n);
  if (capEl) capEl.textContent = n === 1 ? 'active visitor' : 'active visitors';
  status.textContent = 'GA4 Realtime API · refreshed every 30 seconds · last update ' +
    new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  bars(barsEl, (liveData.pages || []).map(p => ({ p: p.page, users: p.users })), 'users', 'p', S.s3, fmt);

  /* Locations are plotted only when the feed actually reports them. The
     realtime endpoint currently returns pages and a total with no geo
     dimension, so rather than scattering invented dots over the globe - which
     would look convincing and mean nothing - the panel says what is missing. */
  const locs = (liveData.locations || []).filter(l => typeof l.lat === 'number' && typeof l.lon === 'number');
  const layer = document.getElementById('globe-pins');
  if (layer) {
    layer.innerHTML = locs.map(l =>
      `<div class="pin" data-lat="${l.lat}" data-lon="${l.lon}"><b></b>` +
      `<em>${esc(l.city || l.country || 'Visitor')}${l.users > 1 ? ' · ' + l.users : ''}</em></div>`).join('');
  }
  if (placesEl) {
    placesEl.innerHTML = locs.length
      ? bars(placesEl, locs.map(l => ({ p: l.city || l.country, users: l.users })), 'users', 'p', S.s3, fmt) || ''
      : `<div class="nodata">The live feed reports active visitors and the pages they are on, but not
         where they are. Adding the country dimension to the realtime query would light up the globe.</div>`;
  }
  if (noteEl) {
    noteEl.textContent = locs.length
      ? `${locs.length} live ${locs.length === 1 ? 'location' : 'locations'} plotted`
      : (n ? 'Live visitors present — location not reported by the feed' : 'No visitors in the last 30 minutes');
  }
}

/* Dashboard live card. Deliberately shows an em-dash, never 0, when the feed is
   unreachable: a fabricated "0 people on the site" is indistinguishable from a
   real zero and the client has no way to tell they are looking at a failure. */
function paintLiveCard() {
  const num = document.getElementById('live-num');
  if (!num) return;                       // not on the dashboard view
  const cap = document.getElementById('live-cap');
  const note = document.getElementById('live-note');
  const pageEl = document.getElementById('live-page');
  const locEl = document.getElementById('live-loc');

  if (!liveData || liveData.error) {
    num.textContent = '–';
    cap.textContent = 'live feed not connected';
    note.textContent = liveData && liveData.error ? liveData.error
      : 'The live visitor feed is only reachable on the hosted copy at azwebcorp.com/reports/.';
    pageEl.textContent = '—';
    locEl.textContent = '—';
    return;
  }

  const n = liveData.activeUsers || 0;
  num.textContent = fmt(n);
  cap.textContent = n === 1 ? 'person is on the website' : 'people are on the website';
  note.textContent = 'See current visitor locations, devices and active pages in the full live view. '
    + 'This signal refreshes automatically every 30 seconds.';

  const top = (liveData.pages || [])[0];
  pageEl.textContent = top ? top.page : 'No active page yet';
  // The realtime endpoint returns activeUsers + pages only - no geo dimension.
  // Say that plainly instead of leaving a box that looks like a real reading.
  const city = (liveData.cities || [])[0];
  locEl.textContent = city ? (city.city || city.name) : (n ? 'Not provided by the live feed' : 'Waiting for the next visit');
}

/* ===========================================================================
   INSIGHT TICKER
   Renders the build-time findings. The track is duplicated so the -50%
   keyframe wraps seamlessly; duration scales with content length so a client
   with nine findings does not get a banner that sprints.
   ======================================================================== */
function renderTicker() {
  const el = document.getElementById('ticker');
  if (!el) return;
  if (!INSIGHTS.length) {
    // Nothing measured yet is a real state - say it rather than padding the
    // banner with filler that looks like a finding.
    el.innerHTML = '<div class="ticker-empty">Not enough search data on this property yet '
      + 'to report movement. Findings appear here once Search Console has a full period to compare.</div>';
    return;
  }
  const item = i => `<span class="tick ${i.tone}"><i></i><b>${esc(i.label)}</b><span>${esc(i.text)}</span></span>`;
  const run = INSIGHTS.map(item).join('');
  el.innerHTML = `<div class="ticker-track">${run}${run}</div>`;
  el.querySelector('.ticker-track').style.setProperty(
    '--ticker-dur', Math.max(45, INSIGHTS.length * 11) + 's');
}

/* ===========================================================================
   ROTATING EARTH
   One full-quad fragment shader ray-casts an orthographic camera against a
   unit sphere. Cheaper and sharper than tessellated geometry: the limb is
   exact rather than faceted, which is what stops a small globe reading as a
   low-poly ball. Day/night are blended by the sun term so the dark side shows
   real city lights instead of flat black.
   ======================================================================== */
const GLOBE_VERT = `
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const GLOBE_FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform float uTilt;
uniform sampler2D uDay; uniform sampler2D uNight;
#define PI 3.14159265359
vec3 rotY(vec3 p, float a){ float s=sin(a), c=cos(a); return vec3(c*p.x - s*p.z, p.y, s*p.x + c*p.z); }
vec3 rotX(vec3 p, float a){ float s=sin(a), c=cos(a); return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z); }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / (0.5*min(uRes.x, uRes.y));
  float r2 = dot(uv, uv);
  vec3 sun = normalize(vec3(-0.78, 0.30, 0.34));
  vec3 view = vec3(0.0, 0.0, 1.0);
  const float R = 0.82;
  float rr = r2/(R*R);
  if (rr > 1.0) {
    float d = sqrt(rr) - 1.0;
    float glow = exp(-d*14.0)*0.55;
    float lit = smoothstep(-0.35, 0.85, dot(normalize(vec3(uv, 0.35)), sun));
    vec3 air = mix(vec3(0.09,0.22,0.42), vec3(0.35,0.55,0.85), lit);
    gl_FragColor = vec4(air*glow, glow);
    return;
  }
  vec3 n = vec3(uv/R, sqrt(max(0.0, 1.0 - rr)));
  vec3 w = rotY(rotX(n, -uTilt), -uTime*0.055);
  float lat = asin(clamp(w.y, -1.0, 1.0));
  float lon = atan(w.z, w.x);
  vec2 tc = vec2(lon/(2.0*PI) + 0.5, 0.5 - lat/PI);
  vec3 dayC = texture2D(uDay, tc).rgb;
  vec3 nightC = texture2D(uNight, tc).rgb;
  float light = smoothstep(-0.18, 0.34, dot(n, sun));
  vec3 col = dayC * (0.035 + 0.965*light);
  col += nightC * 1.15 * pow(1.0 - light, 2.2);
  float fres = pow(1.0 - max(dot(n, view), 0.0), 3.0);
  col += vec3(0.16,0.34,0.62) * fres * (0.35 + 0.9*light);
  vec3 h = normalize(sun + view);
  col += vec3(0.20,0.26,0.32) * pow(max(dot(n, h), 0.0), 22.0) * light * 0.5;
  gl_FragColor = vec4(col, smoothstep(1.0, 0.985, rr));
}`;

const GLOBE_SPIN = 0.055;          // radians/sec, matched to the shader
const GLOBE_TILT = 23.4 * Math.PI / 180;


function glCompile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function glTexture(gl, img) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  // Plain LINEAR, not mipmapped: mip level selection blows up where the
  // longitude seam wraps and paints a dashed line across high latitudes.
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t;
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('texture load failed'));
    i.src = src;
  });
}

async function startGlobe(canvas) {
  const gl = canvas.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: false });
  if (!gl) throw new Error('WebGL is not available in this browser');

  const [day, night] = await Promise.all([loadImage(EARTH_DAY), loadImage(EARTH_NIGHT)]);
  const p = gl.createProgram();
  gl.attachShader(p, glCompile(gl, gl.VERTEX_SHADER, GLOBE_VERT));
  gl.attachShader(p, glCompile(gl, gl.FRAGMENT_SHADER, GLOBE_FRAG));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  gl.useProgram(p);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(p, 'a');
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(p, 'uRes');
  const uTime = gl.getUniformLocation(p, 'uTime');
  gl.uniform1f(gl.getUniformLocation(p, 'uTilt'), GLOBE_TILT);
  gl.uniform1i(gl.getUniformLocation(p, 'uDay'), 0);
  gl.uniform1i(gl.getUniformLocation(p, 'uNight'), 1);
  gl.activeTexture(gl.TEXTURE0); glTexture(gl, day);
  gl.activeTexture(gl.TEXTURE1); glTexture(gl, night);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const t0 = performance.now();
  const state = { canvas, stop: false, t: 0 };
  (function frame() {
    if (state.stop || !canvas.isConnected) return;   // view switched away
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (w && h && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    state.t = (performance.now() - t0) / 1000;
    gl.uniform1f(uTime, state.t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    positionPins(state);
    requestAnimationFrame(frame);
  })();
  return state;
}

/* Project each active location onto the rendered sphere and hide the ones that
   have rotated round the back. Kept in DOM rather than the shader so a marker
   can carry a readable city label. */
function positionPins(state) {
  const layer = document.getElementById('globe-pins');
  if (!layer || !layer.children.length) return;
  const box = state.canvas.getBoundingClientRect();
  const R = 0.82 * 0.5 * Math.min(box.width, box.height);
  const cx = box.width / 2, cy = box.height / 2;
  const spin = state.t * GLOBE_SPIN, tilt = GLOBE_TILT;

  for (const pin of layer.children) {
    const lat = +pin.dataset.lat * Math.PI / 180, lon = +pin.dataset.lon * Math.PI / 180;
    // Texture space -> world, then apply the same spin and tilt as the shader.
    let x = Math.cos(lat) * Math.cos(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.sin(lon);
    let x1 = Math.cos(spin) * x - Math.sin(spin) * z, z1 = Math.sin(spin) * x + Math.cos(spin) * z;
    const y2 = Math.cos(tilt) * y - Math.sin(tilt) * z1, z2 = Math.sin(tilt) * y + Math.cos(tilt) * z1;
    if (z2 <= 0.04) { pin.style.display = 'none'; continue; }   // far side
    pin.style.display = '';
    pin.style.left = (cx + x1 * R) + 'px';
    pin.style.top = (cy - y2 * R) + 'px';
    pin.style.opacity = String(Math.min(1, z2 * 3.2));          // fade at the limb
  }
}

/* Export what is actually on screen, from measured rows only. */
function exportCsv() {
  const esc2 = v => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [];
  lines.push(`AZ Web Corp — ${document.title.replace(' SEO Portal', '')} — exported ${new Date().toISOString()}`);
  lines.push(`Search Console window,${W.cur.days} days ending ${G.current.end}`);
  lines.push('');
  lines.push('Metric,Value,Previous');
  lines.push(`Clicks,${W.cur.clicks},${W.prev.clicks}`);
  lines.push(`Impressions,${W.cur.impressions},${W.prev.impressions}`);
  lines.push(`CTR,${(W.cur.ctr * 100).toFixed(2)}%,${(W.prev.ctr * 100).toFixed(2)}%`);
  lines.push(`Avg position,${W.cur.position.toFixed(1)},${W.prev.position.toFixed(1)}`);
  lines.push('');
  lines.push('Top queries (last 28 days)');
  lines.push('Query,Clicks,Impressions,CTR,Position');
  (G.topQueries || []).forEach(q => lines.push(
    [esc2(q.query), q.clicks, q.impressions, (q.ctr * 100).toFixed(2) + '%', q.position.toFixed(1)].join(',')));
  lines.push('');
  lines.push('Top pages (last 28 days)');
  lines.push('Page,Clicks,Impressions,Position');
  (G.topPages || []).forEach(p => lines.push(
    [esc2(p.page), p.clicks, p.impressions, p.position.toFixed(1)].join(',')));

  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `seo-report-${G.current.end}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function pollLive() {
  try {
    const r = await fetch('api/live.php', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    liveData = await r.json();
  } catch (e) {
    liveData = null;
  }
  paintLive();
}
paintLive();
pollLive();
setInterval(pollLive, 30000);
