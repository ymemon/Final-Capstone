# ----------------------------------------------------------------------
# Force HTTPS and non-www (redirect all variations to https://everythingit.ie)
# ----------------------------------------------------------------------
<IfModule mod_rewrite.c>
RewriteEngine On

# Redirect if not HTTPS OR if www is present
RewriteCond %{HTTPS} off [OR]
RewriteCond %{HTTP_HOST} ^www\.everythingit\.ie [NC]
RewriteRule ^(.*)$ https://everythingit.ie/$1 [L,R=301]
</IfModule>

# ----------------------------------------------------------------------
# Security Headers (Generated by plugin)
# ----------------------------------------------------------------------
# BEGIN HttpHeaders
<IfModule mod_headers.c>
Header always set X-Content-Type-Options "nosniff"
<FilesMatch "\.(php|html)$">
Header set X-Frame-Options "SAMEORIGIN"
Header set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" env=HTTPS
Header set Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'"
</FilesMatch>
</IfModule>
# END HttpHeaders

# BEGIN HttpHeadersAuth
# (empty block – managed by plugin)
# END HttpHeadersAuth

# BEGIN HttpHeadersCompression
# (empty block – managed by plugin)
# END HttpHeadersCompression

# BEGIN HttpHeadersContentType
# (empty block – managed by plugin)
# END HttpHeadersContentType

# BEGIN HttpHeadersExpires
# (empty block – managed by plugin)
# END HttpHeadersExpires

# BEGIN HttpHeadersCookieSecurity
# (empty block – managed by plugin)
# END HttpHeadersCookieSecurity

# BEGIN HttpHeadersTiming
# (empty block – managed by plugin)
# END HttpHeadersTiming

